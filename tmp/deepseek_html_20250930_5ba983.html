<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多媒体竞赛数据看板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --info: #7209b7;
            --warning: #f72585;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --gray-light: #e9ecef;
            --border-radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f7fb;
            color: var(--dark);
            line-height: 1.6;
        }
        
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* 头部样式 */
        .dashboard-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 2rem 0;
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-title h1 {
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        
        .header-title p {
            font-weight: 300;
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .search-container {
            position: relative;
            width: 300px;
        }
        
        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }
        
        .search-container input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 0.95rem;
            transition: var(--transition);
        }
        
        .search-container input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .search-container input:focus {
            background: rgba(255, 255, 255, 0.25);
            outline: none;
        }
        
        /* 统计卡片样式 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            transition: var(--transition);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-size: 1.5rem;
        }
        
        .stat-icon.total {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            color: white;
        }
        
        .stat-icon.active {
            background: linear-gradient(135deg, #4cc9f0, #3a86ff);
            color: white;
        }
        
        .stat-icon.video {
            background: linear-gradient(135deg, #f72585, #b5179e);
            color: white;
        }
        
        .stat-icon.security {
            background: linear-gradient(135deg, #7209b7, #560bad);
            color: white;
        }
        
        .stat-info h3 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }
        
        .stat-info p {
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        /* 筛选器样式 */
        .filter-section {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        
        .filter-title {
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }
        
        .filter-title i {
            margin-right: 0.5rem;
            color: var(--primary);
        }
        
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }
        
        .filter-group label {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--gray);
        }
        
        .filter-select {
            padding: 10px 15px;
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            background: white;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        
        .filter-select:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        .core-area-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .core-area-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .core-area-tag.active {
            background: var(--primary);
            color: white;
        }
        
        .core-area-tag:not(.active) {
            background: var(--gray-light);
            color: var(--gray);
        }
        
        .core-area-tag:not(.active):hover {
            background: #d8d8d8;
        }
        
        /* 竞赛卡片样式 */
        .competitions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        
        .competition-card {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .competition-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .card-header {
            padding: 1.25rem 1.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .competition-title {
            font-weight: 600;
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 0.5rem;
            color: var(--dark);
            flex: 1;
        }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 0.5rem;
        }
        
        .status-active {
            background: rgba(76, 201, 240, 0.15);
            color: #3a86ff;
        }
        
        .status-completed {
            background: rgba(108, 117, 125, 0.15);
            color: var(--gray);
        }
        
        .status-upcoming {
            background: rgba(247, 37, 133, 0.15);
            color: #f72585;
        }
        
        .card-body {
            padding: 0 1.5rem 1.25rem;
            flex: 1;
        }
        
        .competition-meta {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--gray);
        }
        
        .competition-meta i {
            margin-right: 0.25rem;
        }
        
        .competition-summary {
            font-size: 0.9rem;
            color: var(--dark);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .competition-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .tag {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .tag-vqa {
            background: rgba(67, 97, 238, 0.1);
            color: var(--primary);
        }
        
        .tag-security {
            background: rgba(247, 37, 133, 0.1);
            color: #f72585;
        }
        
        .tag-hashing {
            background: rgba(114, 9, 183, 0.1);
            color: var(--info);
        }
        
        .card-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--gray-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .prize-info {
            font-size: 0.85rem;
            color: var(--gray);
        }
        
        .view-details-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .view-details-btn:hover {
            background: var(--secondary);
        }
        
        /* 加载状态 */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(67, 97, 238, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }
        
        .no-results i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--gray-light);
        }
        
        /* 页脚 */
        .dashboard-footer {
            background: white;
            padding: 2rem 0;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            margin-top: 2rem;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer-links {
            display: flex;
            gap: 1.5rem;
        }
        
        .footer-links a {
            color: var(--gray);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .footer-links a:hover {
            color: var(--primary);
        }
        
        /* 响应式设计 */
        @media (max-width: 992px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .search-container {
                width: 100%;
                margin-top: 1rem;
            }
            
            .competitions-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .competitions-grid {
                grid-template-columns: 1fr;
            }
            
            .footer-content {
                flex-direction: column;
                gap: 1rem;
            }
        }
        
        @media (max-width: 576px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-options {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- 头部 -->
        <header class="dashboard-header">
            <div class="header-content">
                <div class="header-title">
                    <h1>多媒体竞赛数据看板</h1>
                    <p>跟踪和分析多媒体技术相关竞赛信息</p>
                </div>
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜索竞赛标题或标签...">
                </div>
            </div>
        </header>

        <!-- 统计信息 -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon total">
                    <i class="fas fa-trophy"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalCompetitions">-</h3>
                    <p>总竞赛数</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon active">
                    <i class="fas fa-play-circle"></i>
                </div>
                <div class="stat-info">
                    <h3 id="activeCompetitions">-</h3>
                    <p>活跃竞赛</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon video">
                    <i class="fas fa-video"></i>
                </div>
                <div class="stat-info">
                    <h3 id="videoQualityCompetitions">-</h3>
                    <p>视频质量评估</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon security">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="stat-info">
                    <h3 id="securityCompetitions">-</h3>
                    <p>多媒体安全</p>
                </div>
            </div>
        </section>

        <!-- 筛选区域 -->
        <section class="filter-section">
            <div class="filter-title">
                <i class="fas fa-filter"></i>
                筛选条件
            </div>
            <div class="filter-options">
                <div class="filter-group">
                    <label>核心领域</label>
                    <div class="core-area-tags">
                        <span class="core-area-tag active" data-area="all">全部</span>
                        <span class="core-area-tag" data-area="视频质量评估">视频质量评估</span>
                        <span class="core-area-tag" data-area="多媒体安全">多媒体安全</span>
                        <span class="core-area-tag" data-area="多媒体哈希与检索">多媒体哈希与检索</span>
                        <span class="core-area-tag" data-area="none">其他</span>
                    </div>
                </div>
                <div class="filter-group">
                    <label for="statusFilter">状态</label>
                    <select class="filter-select" id="statusFilter">
                        <option value="all">全部状态</option>
                        <option value="Active">活跃</option>
                        <option value="Completed">已完成</option>
                        <option value="Upcoming">即将开始</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="sortBy">排序方式</label>
                    <select class="filter-select" id="sortBy">
                        <option value="date-desc">发布日期 (最新)</option>
                        <option value="date-asc">发布日期 (最早)</option>
                        <option value="title">标题 (A-Z)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- 竞赛列表 -->
        <section>
            <h3 class="filter-title">
                <i class="fas fa-list"></i>
                竞赛列表
            </h3>
            <div class="loading-container" id="loadingContainer">
                <div class="spinner"></div>
                <p>正在加载竞赛数据...</p>
            </div>
            <div class="competitions-grid" id="competitionsContainer" style="display: none;">
                <!-- 竞赛卡片将通过JavaScript动态生成 -->
            </div>
        </section>

        <!-- 页脚 -->
        <footer class="dashboard-footer">
            <div class="footer-content">
                <div class="copyright">
                    &copy; 2025 多媒体竞赛数据看板. 保留所有权利.
                </div>
                <div class="footer-links">
                    <a href="#">数据源</a>
                    <a href="#">关于我们</a>
                    <a href="#">联系方式</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- 竞赛详情模态框 -->
    <div class="modal fade" id="competitionModal" tabindex="-1" aria-labelledby="competitionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="competitionModalLabel">竞赛详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- 模态框内容将通过JavaScript动态生成 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <a href="#" class="btn btn-primary" id="sourceLink" target="_blank">查看源信息</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量存储竞赛数据
        let competitions = [];
        let filteredCompetitions = [];

        // 初始化函数
        function init() {
            fetchCompetitions();
            setupEventListeners();
        }

        // 从API获取竞赛数据
        function fetchCompetitions() {
            fetch('https://copmpetition.zzzsleep.eu.org/')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应不正常');
                    }
                    return response.json();
                })
                .then(data => {
                    competitions = data.data;
                    filteredCompetitions = [...competitions];
                    
                    // 隐藏加载指示器，显示竞赛列表
                    document.getElementById('loadingContainer').style.display = 'none';
                    document.getElementById('competitionsContainer').style.display = 'grid';
                    
                    updateStats();
                    renderCompetitions(filteredCompetitions);
                })
                .catch(error => {
                    console.error('获取竞赛数据时出错:', error);
                    document.getElementById('loadingContainer').innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            <h4 class="alert-heading">加载失败</h4>
                            <p>无法从服务器获取竞赛数据。请检查网络连接或稍后重试。</p>
                            <hr>
                            <p class="mb-0">错误信息: ${error.message}</p>
                        </div>
                    `;
                });
        }

        // 更新统计信息
        function updateStats() {
            const total = competitions.length;
            const active = competitions.filter(c => 
                c.status === 'Active' || 
                c.status === 'active' || 
                c.status === 'Ongoing' ||
                c.status === '启动通知' ||
                c.status === '启动'
            ).length;
            
            const videoQuality = competitions.filter(c => 
                c.relevance.core_area.includes('视频质量评估') || 
                c.relevance.core_area.includes('Video Quality Assessment') ||
                c.relevance.core_area.includes('Image/Video Quality Assessment')
            ).length;
            
            const security = competitions.filter(c => 
                c.relevance.core_area.includes('多媒体安全') || 
                c.relevance.core_area.includes('Multimedia Security') ||
                c.relevance.core_area.includes('多媒体信息安全')
            ).length;

            document.getElementById('totalCompetitions').textContent = total;
            document.getElementById('activeCompetitions').textContent = active;
            document.getElementById('videoQualityCompetitions').textContent = videoQuality;
            document.getElementById('securityCompetitions').textContent = security;
        }

        // 渲染竞赛列表
        function renderCompetitions(competitionsToRender) {
            const container = document.getElementById('competitionsContainer');
            
            if (competitionsToRender.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h4>未找到匹配的竞赛</h4>
                        <p>请尝试调整搜索条件或筛选条件</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            competitionsToRender.forEach(competition => {
                const card = createCompetitionCard(competition);
                container.appendChild(card);
            });
        }

        // 创建竞赛卡片
        function createCompetitionCard(competition) {
            const card = document.createElement('div');
            card.className = 'competition-card';
            
            // 处理状态显示
            let statusClass = '';
            let statusText = competition.status;
            
            if (competition.status === 'Active' || competition.status === 'active' || competition.status === 'Ongoing' || competition.status === '启动通知' || competition.status === '启动') {
                statusClass = 'status-active';
                statusText = '活跃';
            } else if (competition.status === 'Completed' || competition.status === 'completed' || competition.status === 'Winner' || competition.status === 'Closed' || competition.status === '已完成' || competition.status === '已结束' || competition.status === '圆满收官') {
                statusClass = 'status-completed';
                statusText = '已完成';
            } else if (competition.status === 'Upcoming' || competition.status === '即将开始') {
                statusClass = 'status-upcoming';
                statusText = '即将开始';
            }
            
            // 处理核心领域标签
            let tagClass = '';
            if (competition.relevance.core_area.includes('视频质量评估') || 
                competition.relevance.core_area.includes('Video Quality Assessment') ||
                competition.relevance.core_area.includes('Image/Video Quality Assessment')) {
                tagClass = 'tag-vqa';
            } else if (competition.relevance.core_area.includes('多媒体安全') || 
                      competition.relevance.core_area.includes('Multimedia Security') ||
                      competition.relevance.core_area.includes('多媒体信息安全')) {
                tagClass = 'tag-security';
            } else if (competition.relevance.core_area.includes('多媒体哈希与检索') || 
                      competition.relevance.core_area.includes('Multimedia Hashing & Retrieval')) {
                tagClass = 'tag-hashing';
            }
            
            // 处理标签显示
            const tagsHtml = competition.tags_ai ? competition.tags_ai.map(tag => 
                `<span class="tag ${tagClass}">${tag}</span>`
            ).join('') : '';
            
            // 处理奖品信息
            let prizeText = '未指定';
            if (competition.prize) {
                if (typeof competition.prize === 'string') {
                    prizeText = competition.prize;
                } else if (typeof competition.prize === 'object') {
                    prizeText = Object.values(competition.prize).join(' / ');
                }
            }
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="competition-title">${competition.title}</div>
                    <span class="status-badge ${statusClass}">${statusText}</span>
                </div>
                <div class="card-body">
                    <div class="competition-meta">
                        <i class="far fa-calendar"></i>
                        ${competition.published_date}
                    </div>
                    <div class="competition-summary">${competition.summary_ai}</div>
                    <div class="competition-tags">
                        ${tagsHtml}
                    </div>
                </div>
                <div class="card-footer">
                    <div class="prize-info">
                        <i class="fas fa-award"></i> ${prizeText}
                    </div>
                    <button class="view-details-btn" data-id="${competition.id}">查看详情</button>
                </div>
            `;
            
            return card;
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 搜索功能
            document.getElementById('searchInput').addEventListener('input', function() {
                filterCompetitions();
            });
            
            // 核心领域筛选
            document.querySelectorAll('.core-area-tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    document.querySelectorAll('.core-area-tag').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    filterCompetitions();
                });
            });
            
            // 状态筛选
            document.getElementById('statusFilter').addEventListener('change', function() {
                filterCompetitions();
            });
            
            // 排序方式
            document.getElementById('sortBy').addEventListener('change', function() {
                sortCompetitions();
            });
            
            // 查看详情按钮
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('view-details-btn')) {
                    const competitionId = e.target.getAttribute('data-id');
                    showCompetitionDetails(competitionId);
                }
            });
        }

        // 筛选竞赛
        function filterCompetitions() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedArea = document.querySelector('.core-area-tag.active').getAttribute('data-area');
            const selectedStatus = document.getElementById('statusFilter').value;
            
            filteredCompetitions = competitions.filter(competition => {
                // 搜索筛选
                const matchesSearch = searchTerm === '' || 
                    competition.title.toLowerCase().includes(searchTerm) ||
                    (competition.tags_ai && competition.tags_ai.some(tag => 
                        tag.toLowerCase().includes(searchTerm)
                    )) ||
                    competition.summary_ai.toLowerCase().includes(searchTerm);
                
                // 核心领域筛选
                let matchesArea = true;
                if (selectedArea !== 'all') {
                    if (selectedArea === 'none') {
                        matchesArea = !competition.relevance.is_relevant;
                    } else {
                        matchesArea = competition.relevance.core_area.includes(selectedArea);
                    }
                }
                
                // 状态筛选
                let matchesStatus = true;
                if (selectedStatus !== 'all') {
                    if (selectedStatus === 'Active') {
                        matchesStatus = competition.status === 'Active' || 
                                       competition.status === 'active' || 
                                       competition.status === 'Ongoing' ||
                                       competition.status === '启动通知' ||
                                       competition.status === '启动';
                    } else if (selectedStatus === 'Completed') {
                        matchesStatus = competition.status === 'Completed' || 
                                       competition.status === 'completed' || 
                                       competition.status === 'Winner' ||
                                       competition.status === 'Closed' ||
                                       competition.status === '已完成' ||
                                       competition.status === '已结束' ||
                                       competition.status === '圆满收官';
                    } else if (selectedStatus === 'Upcoming') {
                        matchesStatus = competition.status === 'Upcoming' || 
                                       competition.status === '即将开始';
                    }
                }
                
                return matchesSearch && matchesArea && matchesStatus;
            });
            
            sortCompetitions();
        }

        // 排序竞赛
        function sortCompetitions() {
            const sortBy = document.getElementById('sortBy').value;
            
            filteredCompetitions.sort((a, b) => {
                if (sortBy === 'date-desc') {
                    return new Date(b.published_date) - new Date(a.published_date);
                } else if (sortBy === 'date-asc') {
                    return new Date(a.published_date) - new Date(b.published_date);
                } else if (sortBy === 'title') {
                    return a.title.localeCompare(b.title, 'zh-CN');
                }
                return 0;
            });
            
            renderCompetitions(filteredCompetitions);
        }

        // 显示竞赛详情
        function showCompetitionDetails(competitionId) {
            const competition = competitions.find(c => c.id === competitionId);
            if (!competition) return;
            
            // 设置模态框标题
            document.getElementById('competitionModalLabel').textContent = competition.title;
            
            // 处理状态显示
            let statusText = competition.status;
            if (competition.status === 'Active' || competition.status === 'active' || competition.status === 'Ongoing') {
                statusText = '活跃';
            } else if (competition.status === 'Completed' || competition.status === 'completed' || competition.status === 'Winner') {
                statusText = '已完成';
            } else if (competition.status === 'Upcoming') {
                statusText = '即将开始';
            }
            
            // 处理截止日期
            let deadlinesText = '未指定';
            if (competition.deadlines && Object.keys(competition.deadlines).length > 0) {
                deadlinesText = Object.entries(competition.deadlines)
                    .map(([key, value]) => `${key}: ${value}`)
                    .join('<br>');
            }
            
            // 处理奖品信息
            let prizeText = '未指定';
            if (competition.prize) {
                if (typeof competition.prize === 'string') {
                    prizeText = competition.prize;
                } else if (typeof competition.prize === 'object') {
                    prizeText = Object.entries(competition.prize)
                        .map(([key, value]) => `${key}: ${value}`)
                        .join('<br>');
                }
            }
            
            // 处理标签
            const tagsHtml = competition.tags_ai ? 
                competition.tags_ai.map(tag => `<span class="tag">${tag}</span>`).join('') : 
                '无';
            
            // 设置模态框内容
            document.getElementById('modalBody').innerHTML = `
                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>发布日期:</strong> ${competition.published_date}
                    </div>
                    <div class="col-md-6">
                        <strong>状态:</strong> ${statusText}
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>核心领域:</strong> ${competition.relevance.core_area}
                    </div>
                    <div class="col-md-6">
                        <strong>标签:</strong> ${tagsHtml}
                    </div>
                </div>
                <div class="mb-3">
                    <strong>关联原因:</strong><br>
                    ${competition.relevance.reason}
                </div>
                <div class="mb-3">
                    <strong>摘要:</strong><br>
                    ${competition.summary_ai}
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>截止日期:</strong><br>
                        ${deadlinesText}
                    </div>
                    <div class="col-md-6">
                        <strong>奖金:</strong><br>
                        ${prizeText}
                    </div>
                </div>
                <div class="mb-3">
                    <strong>数据来源:</strong><br>
                    ${competition.source}
                </div>
            `;
            
            // 设置源链接
            document.getElementById('sourceLink').href = competition.url;
            
            // 显示模态框
            const modal = new bootstrap.Modal(document.getElementById('competitionModal'));
            modal.show();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
