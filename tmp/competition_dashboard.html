<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞赛数据看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .filters {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .filters h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .competitions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .competition-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .competition-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .competition-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(180deg, #667eea, #764ba2);
        }

        .competition-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
            line-height: 1.4;
        }

        .tag {
            display: inline-block;
            padding: 5px 12px;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 0.85em;
            margin: 5px 5px 5px 0;
            color: #555;
        }

        .tag.core-area {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 10px;
        }

        .status.active {
            background: #4ade80;
            color: white;
        }

        .status.completed {
            background: #94a3b8;
            color: white;
        }

        .status.winner {
            background: #fbbf24;
            color: white;
        }

        .prize {
            color: #f59e0b;
            font-weight: bold;
            margin-top: 10px;
        }

        .date {
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .summary {
            color: #555;
            line-height: 1.6;
            margin: 15px 0;
            font-size: 0.95em;
        }

        .link {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
            margin-top: 10px;
            display: inline-block;
        }

        .link:hover {
            text-decoration: underline;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .competitions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 竞赛数据看板</h1>
            <p>多媒体技术竞赛信息汇总</p>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="filters">
            <h2>筛选与搜索</h2>
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索竞赛标题、标签或摘要...">
            <div class="filter-group" id="filterGroup"></div>
        </div>

        <div class="competitions-grid" id="competitionsGrid"></div>
    </div>

    <script>
        let allCompetitions = [];
        let filteredCompetitions = [];
        let activeFilter = 'all';

        async function loadData() {
            try {
                const response = await fetch('https://copmpetition.zzzsleep.eu.org/');
                const jsonData = await response.json();
                allCompetitions = jsonData.data;
                filteredCompetitions = allCompetitions;
                renderStats();
                renderFilters();
                renderCompetitions();
            } catch (error) {
                console.error('数据加载失败:', error);
            }
        }

        function renderStats() {
            const total = allCompetitions.length;
            const relevant = allCompetitions.filter(c => c.relevance.is_relevant).length;
            const active = allCompetitions.filter(c => c.status && (c.status.toLowerCase().includes('active') || c.status.includes('启动') || c.status.includes('进行'))).length;
            
            const coreAreas = {};
            allCompetitions.forEach(c => {
                if (c.relevance.is_relevant && c.relevance.core_area) {
                    coreAreas[c.relevance.core_area] = (coreAreas[c.relevance.core_area] || 0) + 1;
                }
            });

            const statsHTML = `
                <div class="stat-card">
                    <h3>总竞赛数</h3>
                    <div class="value">${total}</div>
                </div>
                <div class="stat-card">
                    <h3>相关竞赛</h3>
                    <div class="value">${relevant}</div>
                </div>
                <div class="stat-card">
                    <h3>进行中</h3>
                    <div class="value">${active}</div>
                </div>
                <div class="stat-card">
                    <h3>核心领域</h3>
                    <div class="value">${Object.keys(coreAreas).length}</div>
                </div>
            `;
            document.getElementById('statsGrid').innerHTML = statsHTML;
        }

        function renderFilters() {
            const coreAreas = new Set();
            allCompetitions.forEach(c => {
                if (c.relevance.is_relevant && c.relevance.core_area) {
                    coreAreas.add(c.relevance.core_area);
                }
            });

            let filtersHTML = '<button class="filter-btn active" onclick="filterBy(\'all\')">全部</button>';
            filtersHTML += '<button class="filter-btn" onclick="filterBy(\'relevant\')">仅相关</button>';
            filtersHTML += '<button class="filter-btn" onclick="filterBy(\'active\')">进行中</button>';
            
            coreAreas.forEach(area => {
                filtersHTML += `<button class="filter-btn" onclick="filterBy('${area}')">${area}</button>`;
            });

            document.getElementById('filterGroup').innerHTML = filtersHTML;
        }

        function filterBy(type) {
            activeFilter = type;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (type === 'all') {
                filteredCompetitions = allCompetitions;
            } else if (type === 'relevant') {
                filteredCompetitions = allCompetitions.filter(c => c.relevance.is_relevant);
            } else if (type === 'active') {
                filteredCompetitions = allCompetitions.filter(c => 
                    c.status && (c.status.toLowerCase().includes('active') || c.status.includes('启动') || c.status.includes('进行'))
                );
            } else {
                filteredCompetitions = allCompetitions.filter(c => c.relevance.core_area === type);
            }

            applySearch();
        }

        function applySearch() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            let competitions = filteredCompetitions;

            if (searchTerm) {
                competitions = competitions.filter(c => {
                    const title = c.title.toLowerCase();
                    const summary = c.summary_ai.toLowerCase();
                    const tags = c.tags_ai.join(' ').toLowerCase();
                    return title.includes(searchTerm) || summary.includes(searchTerm) || tags.includes(searchTerm);
                });
            }

            renderCompetitions(competitions);
        }

        function renderCompetitions(competitions = filteredCompetitions) {
            const grid = document.getElementById('competitionsGrid');
            
            if (competitions.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: white; padding: 40px;">未找到相关竞赛</div>';
                return;
            }

            grid.innerHTML = competitions.map(comp => {
                const statusClass = comp.status ? comp.status.toLowerCase().replace(/\s+/g, '-') : '';
                const prizeText = typeof comp.prize === 'object' ? JSON.stringify(comp.prize) : comp.prize;
                
                return `
                    <div class="competition-card">
                        <h3>${comp.title}</h3>
                        <div class="date">📅 ${comp.published_date}</div>
                        ${comp.relevance.is_relevant ? `<span class="tag core-area">${comp.relevance.core_area}</span>` : ''}
                        ${comp.tags_ai.slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('')}
                        <div class="status ${statusClass}">${comp.status || '未知'}</div>
                        <div class="summary">${comp.summary_ai}</div>
                        ${prizeText && prizeText !== 'Not specified' && prizeText !== 'not specified' ? `<div class="prize">💰 ${prizeText}</div>` : ''}
                        <a href="${comp.url}" target="_blank" class="link">查看详情 →</a>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('searchBox').addEventListener('input', applySearch);

        loadData();
    </script>
</body>
</html>
